<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caja Huanaco">
<meta name="format-detection" content="telephone=no">
<title>Caja Huanaco · Ferias</title>
</head>
<body>
<style>
  :root{
    --ink:#1A1917;--ink-soft:#5C5A54;--paper:#FFFFFF;--wall:#E9E7E1;--line:#D2CFC7;
    --green:#0F5A4E;--green-dark:#0A3F37;--amber:#B5641A;--red:#9B2C2C;--radius:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:0;background:var(--wall);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.4;padding-bottom:200px}
  .num{font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
  header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 12px 8px}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .brand{font-weight:700;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:6px;min-width:0}
  .brand select{font-size:15px;font-weight:700;border:1px solid var(--line);border-radius:8px;background:#F7F6F3;padding:6px 4px;color:var(--ink);max-width:48vw}
  .daystat{font-size:14px;color:var(--ink-soft);text-align:right}
  .lang{border:1px solid var(--line);background:#F7F6F3;border-radius:8px;font-size:14px;font-weight:700;padding:7px 10px;color:var(--ink)}
  .pay{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
  .pay button{padding:12px 4px;border:1px solid var(--line);background:#F7F6F3;color:var(--ink-soft);border-radius:var(--radius);font-size:15.5px;font-weight:600;line-height:1.15}
  .pay button small{display:block;font-size:12px;font-weight:500;margin-top:2px}
  .pay button.on{background:var(--green);border-color:var(--green);color:#fff}
  section{padding:12px 12px 0}
  h2{font-size:13px;font-weight:700;color:var(--ink-soft);margin:16px 0 7px;letter-spacing:.03em}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .prod{position:relative;min-height:68px;padding:8px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;justify-content:space-between;color:var(--ink)}
  .prod:active{background:#EDEBE6;transform:scale(.985)}
  .prod .n{font-size:13.5px;font-weight:600;line-height:1.2}
  .prod .p{font-size:17px;font-weight:700;margin-top:4px}
  .prod .badge{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;border-radius:12px;background:var(--green);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
  .prod.edit{border-style:dashed}
  .ticket{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #EFEDE8}
  .li:last-child{border-bottom:none}
  .li .name{flex:1;font-size:15.5px}
  .li .sub{display:block;font-size:13px;color:var(--ink-soft)}
  .li .amt{font-size:17px;font-weight:700;min-width:78px;text-align:right}
  .qbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#F7F6F3;font-size:18px;font-weight:700;color:var(--ink)}
  .empty{padding:16px 12px;color:var(--ink-soft);font-size:15px}
  footer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding:9px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(0,0,0,.07)}
  .totline{display:flex;align-items:baseline;justify-content:space-between}
  .totline .lbl{font-size:14px;color:var(--ink-soft)}
  .big{font-size:38px;font-weight:800;line-height:1.05}
  .actions{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px;margin-top:8px}
  .actions button{padding:14px 6px;border-radius:var(--radius);font-size:16.5px;font-weight:700;border:1px solid var(--line);background:#F7F6F3;color:var(--ink)}
  .actions .primary{background:var(--green);border-color:var(--green);color:#fff}
  .vuelto{display:flex;gap:6px;align-items:center;margin-top:8px}
  .vuelto input{flex:1;min-width:0;padding:12px;font-size:18px;border:1px solid var(--line);border-radius:var(--radius);background:#F7F6F3}
  .vuelto .out{font-size:16.5px;font-weight:700;white-space:nowrap}
  .tools{display:flex;gap:6px;flex-wrap:wrap;padding:16px 12px 24px}
  .tools button{flex:1;padding:12px 8px;font-size:14.5px;border:1px solid var(--line);background:var(--paper);border-radius:var(--radius);color:var(--ink-soft);font-weight:600}
  dialog{border:none;border-radius:14px;padding:0;width:min(92vw,420px);max-height:92vh;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  dialog::backdrop{background:rgba(26,25,23,.5)}
  .dlg{padding:16px}
  .dlg h3{margin:0 0 12px;font-size:18px}
  .dlg label{display:block;font-size:13px;color:var(--ink-soft);margin:10px 0 4px}
  .dlg input,.dlg select{width:100%;padding:11px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:#F7F6F3}
  .dlg .row{display:flex;gap:8px;margin-top:16px}
  .dlg .row button{flex:1;padding:13px;border-radius:8px;font-size:16px;font-weight:700;border:1px solid var(--line);background:#F7F6F3;color:var(--ink)}
  .dlg .row .primary{background:var(--green);border-color:var(--green);color:#fff}
  .dlg .row .danger{background:#fff;border-color:var(--red);color:var(--red)}
  .dlg .hint{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.4}
  .log{font-size:14px;max-height:46vh;overflow:auto}
  .log div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #EFEDE8}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:200px;z-index:50;background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .18s;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  .grow{display:flex;gap:5px;align-items:center;margin-bottom:6px}
  .grow input{flex:1;min-width:0;padding:10px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:#F7F6F3}
  .grow button{width:38px;height:40px;flex:none;border:1px solid var(--line);background:#F7F6F3;border-radius:8px;font-size:15px;font-weight:700;color:var(--ink-soft)}
  .grow button.x{background:#FFF2F2;border-color:#E7C4C4;color:var(--red)}
  .grow .cnt{font-size:11px;color:var(--ink-soft);width:40px;text-align:center;flex:none}
  .del{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:13px;background:var(--red);color:#fff;font-size:15px;font-weight:700;line-height:26px;text-align:center}
  .qdel{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#FFF2F2;color:var(--red);font-size:16px;font-weight:700}
  /* cobro */
  .cobro{text-align:center}
  .cobro .monto{font-size:44px;font-weight:800;line-height:1.1;margin:2px 0 8px}
  .cobro .qr{width:min(70vw,300px);margin:6px auto;background:#fff;padding:6px;border:1px solid var(--line);border-radius:10px}
  .cobro .qr svg{display:block;width:100%;height:auto}
  .cobro .iban{font-size:19px;font-weight:700;letter-spacing:.04em;word-break:break-word;margin:6px 0 2px}
  .cobro .meta{font-size:14px;color:var(--ink-soft)}
  .cuentas{display:flex;gap:6px;margin:8px 0}
  .cuentas button{flex:1;padding:11px 6px;border:1px solid var(--line);background:#F7F6F3;border-radius:8px;font-size:15px;font-weight:700;color:var(--ink-soft)}
  .cuentas button.on{background:var(--green);border-color:var(--green);color:#fff}
  .ok{color:var(--green)} .mal{color:var(--red)}
  @media (min-width:700px){
    body{font-size:19px;padding-bottom:240px}
    header,section,footer{max-width:940px;margin-left:auto;margin-right:auto}
    .brand{font-size:17px} .brand select{font-size:17px} .daystat{font-size:16px}
    .pay button{font-size:18px;padding:15px 6px} .pay button small{font-size:13.5px}
    h2{font-size:15px;margin:22px 0 9px}
    .grid{gap:9px}
    .prod{min-height:84px;padding:12px} .prod .n{font-size:16px} .prod .p{font-size:22px}
    .prod .badge{min-width:30px;height:30px;border-radius:15px;font-size:16px}
    .li{padding:11px 12px} .li .name{font-size:18px} .li .sub{font-size:15px} .li .amt{font-size:21px;min-width:110px}
    .qbtn,.qdel{width:44px;height:44px;font-size:22px}
    .tools button{font-size:16px;padding:15px 10px}
    .totline .lbl{font-size:16px} .big{font-size:48px}
    .vuelto input{font-size:21px;padding:14px} .vuelto .out{font-size:19px}
    .actions button{font-size:19px;padding:17px 8px}
    .toast{font-size:17px;bottom:230px}
    dialog{width:min(90vw,560px)}
    .dlg{padding:22px} .dlg h3{font-size:22px} .dlg label{font-size:15px}
    .dlg input,.dlg select{font-size:18px;padding:13px} .dlg .row button{font-size:18px;padding:15px}
    .grow input{font-size:17px;padding:12px} .grow button{width:44px;height:46px;font-size:18px}
    .log{font-size:16px}
    .cobro .monto{font-size:56px} .cobro .iban{font-size:23px}
  }
  @media (min-width:1000px){
    body{font-size:22px;padding-bottom:280px}
    header,section,footer{max-width:1060px}
    .brand{font-size:20px} .brand select{font-size:20px} .daystat{font-size:19px}
    .pay button{font-size:21px;padding:18px 6px} .pay button small{font-size:15px}
    h2{font-size:17px;margin:26px 0 11px}
    .grid{gap:11px}
    .prod{min-height:132px;padding:16px} .prod .n{font-size:30px} .prod .p{font-size:30px}
    .prod .badge{min-width:36px;height:36px;border-radius:18px;font-size:19px}
    .li{padding:14px} .li .name{font-size:21px} .li .sub{font-size:17px} .li .amt{font-size:25px;min-width:140px}
    .qbtn,.qdel{width:52px;height:52px;font-size:26px}
    .tools button{font-size:18px;padding:18px 12px}
    .totline .lbl{font-size:19px} .big{font-size:60px}
    .vuelto input{font-size:25px;padding:17px} .vuelto .out{font-size:22px}
    .actions button{font-size:22px;padding:21px 10px}
    .toast{font-size:20px;bottom:270px}
    dialog{width:min(80vw,640px)}
    .dlg{padding:28px} .dlg h3{font-size:26px} .dlg label{font-size:17px}
    .dlg input,.dlg select{font-size:21px;padding:15px} .dlg .row button{font-size:20px;padding:17px}
    .grow input{font-size:20px;padding:14px} .grow button{width:50px;height:52px;font-size:20px}
    .log{font-size:18px}
  }
</style>

<noscript>
  <div style="margin:12px;padding:14px;border:2px solid #9B2C2C;border-radius:10px;background:#fff;color:#9B2C2C;font-weight:600">
    Abrí este archivo con Safari o Chrome / Open this file in Safari or Chrome.
  </div>
</noscript>

<header>
  <div class="hrow">
    <span class="brand">HUANACO <select id="feriaSel"></select></span>
    <span class="daystat num" id="daystat"></span>
    <button class="lang" id="langBtn">EN</button>
  </div>
  <div class="pay" id="pay"></div>
</header>

<section>
  <div id="cats"></div>
  <h2 data-i18n="ticket">Ticket</h2>
  <div class="ticket" id="ticket"></div>
  <div id="estado" style="margin:14px 0 0;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;display:none"></div>
  <div class="tools">
    <button id="btnEdit"></button>
    <button id="btnAdd" data-i18n="addProd">+ Producto</button>
    <button id="btnGrupos" data-i18n="groups">Grupos</button>
    <button id="btnLog" data-i18n="salesDay">Ventas del día</button>
    <button id="btnSet" data-i18n="setPay">Datos de cobro</button>
  </div>
</section>

<footer>
  <div class="totline">
    <div class="lbl" id="totLbl"></div>
    <div class="big num" id="total">0 €</div>
  </div>
  <div class="vuelto" id="vueltoBox" hidden>
    <input id="paga" type="number" inputmode="decimal" step="0.01">
    <span class="out num" id="vuelto"></span>
  </div>
  <div class="actions">
    <button id="btnUndo" data-i18n="undo">Deshacer</button>
    <button id="btnClear" data-i18n="clear">Borrar</button>
    <button class="primary" id="btnCobrar" data-i18n="charge">Cobrar</button>
  </div>
</footer>

<div class="toast" id="toast"></div>

<dialog id="dlgProd"><div class="dlg">
  <h3 id="dlgProdTitle"></h3>
  <label for="fName" data-i18n="name">Nombre</label>
  <input id="fName">
  <label for="fPrice" data-i18n="priceFinal">Precio final (€)</label>
  <input id="fPrice" type="number" inputmode="decimal" step="0.01">
  <label for="fCat" data-i18n="group">Grupo</label>
  <input id="fCat" list="catlist">
  <datalist id="catlist"></datalist>
  <div class="row">
    <button id="fDelete" class="danger" data-i18n="delete">Eliminar</button>
    <button id="fCancel" data-i18n="cancel">Cancelar</button>
    <button id="fSave" class="primary" data-i18n="save">Guardar</button>
  </div>
</div></dialog>

<dialog id="dlgFree"><div class="dlg">
  <h3 data-i18n="freeAmt">Monto libre</h3>
  <label for="fFree" data-i18n="amount">Importe (€)</label>
  <input id="fFree" type="number" inputmode="decimal" step="0.01">
  <label for="fFreeName" data-i18n="detailOpt">Detalle (opcional)</label>
  <input id="fFreeName">
  <div class="row">
    <button id="freeCancel" data-i18n="cancel">Cancelar</button>
    <button id="freeSave" class="primary" data-i18n="add">Agregar</button>
  </div>
</div></dialog>

<dialog id="dlgGru"><div class="dlg">
  <h3 data-i18n="groupsTitle">Grupos de productos</h3>
  <div id="gList"></div>
  <button id="gAdd" style="width:100%;margin-top:10px;padding:12px;border:1px dashed var(--line);background:#F7F6F3;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink)" data-i18n="addGroup">+ Agregar grupo</button>
  <div class="row" style="margin-top:14px">
    <button id="gExport" data-i18n="dlCat">Descargar catálogo</button>
    <button id="gImport" data-i18n="loadCat">Cargar catálogo</button>
  </div>
  <input id="gFile" type="file" accept=".json,application/json" hidden>
  <div class="hint" id="gHint"></div>
  <button id="gReset" style="width:100%;margin-top:8px;padding:10px;border:1px solid #E7C4C4;background:#FFF2F2;border-radius:8px;font-size:13px;font-weight:600;color:var(--red)" data-i18n="resetCat">Restaurar catálogo de ejemplo</button>
  <div class="row">
    <button id="gCancel" data-i18n="cancel">Cancelar</button>
    <button id="gSave" class="primary" data-i18n="save">Guardar</button>
  </div>
</div></dialog>

<dialog id="dlgLog"><div class="dlg">
  <h3 data-i18n="salesDay">Ventas del día</h3>
  <div id="logBody" class="log"></div>
  <div id="logSum" style="margin-top:12px;font-size:14px;font-weight:700"></div>
  <div class="row">
    <button id="logCopy" data-i18n="copySummary">Copiar resumen</button>
    <button id="logCierres" data-i18n="closings">Cierres guardados</button>
  </div>
  <div class="row">
    <button id="logExp" data-i18n="exportCsv">Exportar a Excel</button>
    <button id="logClose" class="primary" data-i18n="back">Volver</button>
  </div>
  <div class="row">
    <button id="logReset" class="danger" data-i18n="closeCash">Cerrar caja (la guarda)</button>
  </div>
</div></dialog>

<dialog id="dlgCie"><div class="dlg">
  <h3 data-i18n="closings">Cierres guardados</h3>
  <div id="cieBody" class="log"></div>
  <div class="row"><button id="cieClose" class="primary" data-i18n="back">Volver</button></div>
</div></dialog>

<dialog id="dlgExp"><div class="dlg">
  <h3 data-i18n="exportCsv">Exportar a Excel</h3>
  <div class="hint" id="expHint"></div>
  <div class="row"><button id="eVentas" class="primary" data-i18n="expSales">Ventas (una fila por venta)</button></div>
  <div class="row"><button id="eMedios" data-i18n="expMedia">Totales por medio de pago</button></div>
  <div class="row"><button id="eCopy" data-i18n="expCopy">Copiar para pegar en Excel</button></div>
  <div class="row"><button id="eCancel" data-i18n="cancel">Cancelar</button></div>
</div></dialog>

<dialog id="dlgSet"><div class="dlg">
  <h3 data-i18n="setPay">Datos de cobro</h3>
  <label for="sPaypal" data-i18n="paypalUser">Usuario PayPal.Me</label>
  <input id="sPaypal" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="paypal.me/huanaco">
  <label for="sTitular" data-i18n="holder">Titular de las cuentas</label>
  <input id="sTitular" placeholder="Huanaco">
  <label for="sPaypalLink" data-i18n="ppLinkLbl">Link de pago con tarjeta (opcional)</label>
  <input id="sPaypalLink" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://www.paypal.com/ncp/payment/...">
  <div id="sCuentas"></div>
  <div class="hint" data-i18n="setHint"></div>
  <div class="row">
    <button id="sCancel" data-i18n="cancel">Cancelar</button>
    <button id="sSave" class="primary" data-i18n="save">Guardar</button>
  </div>
</div></dialog>

<dialog id="dlgPP"><div class="dlg cobro">
  <h3>PayPal</h3>
  <div class="monto num" id="ppMonto"></div>
  <div class="cuentas" id="ppModos"></div>
  <div class="qr" id="ppQr"></div>
  <div class="meta" id="ppMeta"></div>
  <div class="row">
    <button id="ppCancel" data-i18n="cancel">Cancelar</button>
    <button id="ppOk" class="primary" data-i18n="paidOk">Cobrado ✓</button>
  </div>
</div></dialog>

<dialog id="dlgTr"><div class="dlg cobro">
  <h3 data-i18n="transfer">Transferencia</h3>
  <div class="monto num" id="trMonto"></div>
  <div class="cuentas" id="trCuentas"></div>
  <div class="qr" id="trQr" hidden></div>
  <div class="iban num" id="trIban"></div>
  <div class="meta" id="trMeta"></div>
  <div class="row">
    <button id="trCopy" data-i18n="copyIban">Copiar IBAN</button>
    <button id="trCopyAmt" data-i18n="copyAmt">Copiar importe</button>
  </div>
  <div class="row">
    <button id="trCancel" data-i18n="cancel">Cancelar</button>
    <button id="trOk" class="primary" data-i18n="paidOk">Cobrado ✓</button>
  </div>
</div></dialog>

function ibanValido(iban){
  const s = String(iban||'').replace(/\s+/g,'').toUpperCase();
  if(!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s)) return false;
  const r = s.slice(4)+s.slice(0,4);
  let rem = 0;
  for(const c of r){ const v = parseInt(c,36); rem = (v>9 ? rem*100+v : rem*10+v) % 97; }
  return rem === 1;
}
const ibanLindo = i => String(i||'').replace(/\s+/g,'').toUpperCase().replace(/(.{4})/g,'$1 ').trim();

async function syncCatalogo(){
  if(!location.protocol.startsWith('http')) return;
  try{
    const r = await fetch('catalogo-' + SLUG[feria] + '.json?v=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const cat = await r.json();
    if(Array.isArray(cat.productos) && Array.isArray(cat.grupos) && cat.catalogo && cat.catalogo !== cfg.catalogo){
      cfg.catalogo = cat.catalogo; cfg.grupos = cat.grupos; cfg.productos = cat.productos;
      STORE.set(K('cfg'), JSON.stringify(cfg));
    }
  }catch(e){}
}
async function load(){
  cfg = clone(DEFAULTS); ventas = []; cierres = [];
  try{ const v = STORE.get(K('cfg'));     if(v) cfg = JSON.parse(v); }catch(e){}
  try{ const v = STORE.get(K('ventas'));  if(v) ventas = JSON.parse(v); }catch(e){}
  try{ const v = STORE.get(K('cierres')); if(v) cierres = JSON.parse(v); }catch(e){}
  try{ const v = STORE.get('caja:ajustes'); if(v) ajustes = Object.assign(clone(AJ_DEFAULT), JSON.parse(v)); }catch(e){}
  if(cfg.catalogo === 'ejemplo-2026-11') cfg = clone(DEFAULTS);   // reemplaza la lista de ejemplo anterior
  else if(cfg.catalogo === 'huanaco-ferias-2026-11' && Array.isArray(cfg.productos)){   // suma productos nuevos sin pisar tus cambios
    DEFAULTS.productos.forEach(d=>{ if(!cfg.productos.some(p=>p.id===d.id)) cfg.productos.push(clone(d)); });
    DEFAULTS.grupos.forEach(g=>{ if(!cfg.grupos.includes(g)) cfg.grupos.push(g); });
    cfg.catalogo = DEFAULTS.catalogo; saveCfg();
  }
  await syncCatalogo();
  if(!Array.isArray(cfg.productos)) cfg.productos = clone(DEFAULTS.productos);
  if(!Array.isArray(cfg.grupos) || !cfg.grupos.length) cfg.grupos = [...new Set(cfg.productos.map(p=>p.cat))];
  cfg.productos.forEach(p=>{ if(!cfg.grupos.includes(p.cat)) cfg.grupos.push(p.cat); });
}
const saveCfg = () => STORE.set(K('cfg'), JSON.stringify(cfg));
const saveCierres = () => STORE.set(K('cierres'), JSON.stringify(cierres));
const saveAjustes = () => STORE.set('caja:ajustes', JSON.stringify(ajustes));
let guardaOK = null;
function saveVentas(){
  const txt = JSON.stringify(ventas);
  STORE.set(K('ventas'), txt);
  guardaOK = (STORE.get(K('ventas')) === txt) && STORE.persistente;
  renderEstado();
}
function renderEstado(){
  const el = document.getElementById('estado');
  if(guardaOK === false || (guardaOK === null && !STORE.persistente)){
    el.style.display='block'; el.style.background='#FFF2F2'; el.style.color='var(--red)'; el.style.border='1px solid #E7C4C4';
    el.textContent = t('stNo');
  }else if(guardaOK === true){
    el.style.display='block'; el.style.background='#F0F7F4'; el.style.color='var(--green)'; el.style.border='1px solid #C8DED6';
    el.textContent = t('stOk',{n:ventas.length});
  }else el.style.display='none';
}

async function borrarProducto(p){
  if(!confirm(t('delProd',{n:p.nombre}))) return;
  cfg.productos = cfg.productos.filter(x=>x!==p);
  ticket = ticket.filter(i=>i.ref!==p.id);
  saveCfg(); render(); toast(t('prodDeleted'));
}
function renderTicket(){
  const el = $('ticket');
  if(!ticket.length){ el.innerHTML = '<div class="empty">'+esc(t('empty'))+'</div>'; return; }
  el.innerHTML = '';
  ticket.forEach((it,idx)=>{
    const row = document.createElement('div'); row.className = 'li';
    const minus = document.createElement('button'); minus.className='qbtn'; minus.textContent='−';
    minus.onclick = ()=>{ it.qty--; if(it.qty<=0) ticket.splice(idx,1); render(); };
    const plus = document.createElement('button'); plus.className='qbtn'; plus.textContent='+';
    plus.onclick = ()=>{ it.qty++; render(); };
    const name = document.createElement('div'); name.className='name';
    name.innerHTML = esc(it.nombre)+'<span class="sub num">'+it.qty+' × '+fmt(it.precio)+'</span>';
    const amt = document.createElement('div'); amt.className='amt num'; amt.textContent = fmt(it.precio*it.qty);
    const del = document.createElement('button'); del.className='qdel'; del.textContent='✕';
    del.onclick = ()=>{ ticket.splice(idx,1); render(); };
    row.append(minus, plus, name, amt, del);
    el.appendChild(row);
  });
}
function renderTotal(){
  $('total').textContent = fmt(total());
  $('vueltoBox').hidden = !(pagoSel==='ef' && ticket.length);
  calcVuelto();

  $('daystat').textContent = n + ' ' + (n===1?t('sale'):t('sales')) + ' · ' + fmt(ventas.reduce((a,v)=>a+v.total,0));

/* ================= acciones ================= */
function agregar(p){
  const ex = ticket.find(i=>i.ref===p.id);
  if(ex) ex.qty++; else ticket.push({ref:p.id, nombre:p.nombre, precio:p.precio, qty:1});
  render();
}
function calcVuelto(){
  const paga = parseFloat($('paga').value), out = $('vuelto');
  if(isNaN(paga) || !ticket.length){ out.textContent = t('change') + ' —'; out.style.color=''; return; }
  const v = r2(paga - total());
  out.textContent = v>=0 ? t('change')+' '+fmt(v) : t('missing')+' '+fmt(-v);
  out.style.color = v>=0 ? 'var(--green)' : 'var(--red)';
}
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 1800);
}
function limpiar(){ ticket=[]; $('paga').value=''; render(); }
function copiar(txt, okMsg){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
  let ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(!ok && navigator.clipboard){ navigator.clipboard.writeText(txt).then(()=>toast(okMsg||t('copied')),()=>toast(t('cantCopy'))); return; }
  toast(ok ? (okMsg||t('copied')) : t('cantCopy'));
}
$('paga').addEventListener('input', calcVuelto);
$('btnUndo').onclick = ()=>{
  if(!ticket.length) return;
  const last = ticket[ticket.length-1]; last.qty--; if(last.qty<=0) ticket.pop(); render();
};
$('btnClear').onclick = ()=>{ if(ticket.length) limpiar(); };

function registrar(pago, extra){
  const tot = total();
  ventas.push({
    hora: new Date().toISOString(), feria, pago, total: tot, cuenta: (extra && extra.cuenta) || '',
    items: ticket.map(i=>({n:i.nombre, q:i.qty, p:i.precio}))
  });
  saveVentas();
  toast(t('charged') + ' ' + fmt(tot));
  limpiar();
}
$('btnCobrar').onclick = ()=>{
  if(!ticket.length) return;
  if(pagoSel==='pp') abrirPayPal();
  else if(pagoSel==='tr') abrirTransfer();
  else registrar('ef');
};

/* ================= QR ================= */
function qrSvg(texto){
  const qr = qrcode(0, 'M');
  qr.addData(texto); qr.make();
  return qr.createSvgTag({cellSize:6, margin:2, scalable:true});
}
function usuarioPaypal(v){
  v = String(v||'').trim().replace(/[?#].*$/,'').replace(/\/+$/,'');
  const m = v.match(/(?:paypal\.me|paypal\.com\/paypalme)\/([^\/\s]+)/i);
  return (m ? m[1] : v.replace(/^@/,'')).replace(/[^A-Za-z0-9._-]/g,'');
}
let ppModo = 'me';
function renderPayPal(){
  const monto = total();
  const user = usuarioPaypal(ajustes.paypal), link = (ajustes.paypalLink||'').trim();
  const modos = []; if(user) modos.push('me'); if(link) modos.push('card');
  if(!modos.length){ toast(t('ppNoUser')); abrirAjustes(); return false; }
  if(!modos.includes(ppModo)) ppModo = modos[0];
  $('ppMonto').textContent = fmt(monto);
  const cont = $('ppModos'); cont.innerHTML = '';
  if(modos.length > 1) modos.forEach(m=>{
    const b = document.createElement('button');
    b.textContent = t(m==='me' ? 'ppMe' : 'ppCard'); b.className = m===ppModo ? 'on' : '';
    b.onclick = ()=>{ ppModo = m; renderPayPal(); };
    cont.appendChild(b);
  });
  const url = ppModo==='me' ? 'https://www.paypal.com/paypalme/' + user + '/' + monto.toFixed(2) + 'EUR' : link;
  $('ppQr').innerHTML = qrSvg(url);
  $('ppMeta').innerHTML = (ppModo==='me' ? esc(t('ppScan')) : esc(t('ppCardNote',{m:fmt(monto)})))
    + '<br><span style="font-size:12px;word-break:break-all">' + esc(url.replace('https://www.','')) + '</span>';
  return true;
}
function abrirPayPal(){ if(renderPayPal()) $('dlgPP').showModal(); }
$('ppCancel').onclick = ()=> $('dlgPP').close();
$('ppOk').onclick = ()=>{ $('dlgPP').close(); registrar('pp'); };

let cuentaSel = 'es';
function epcPayload(c, monto, ref){
  // EPC069-12 (SEPA Credit Transfer QR). BIC opcional en v002.
  const nombre = (ajustes.titular||'').slice(0,70);
  return ['BCD','002','1','SCT',(c.bic||'').replace(/\s/g,''),nombre,c.iban.replace(/\s/g,''),'EUR'+monto.toFixed(2),'','',String(ref).slice(0,140)].join('\n');
}
function renderTransfer(){
  const monto = total();
  const cuentas = (ajustes.cuentas||[]).filter(c=>c.iban);
  if(!cuentas.length){ toast(t('trNoIban')); return false; }
  if(!cuentas.some(c=>c.id===cuentaSel)) cuentaSel = cuentas[0].id;
  const c = cuentas.find(x=>x.id===cuentaSel);
  $('trMonto').textContent = fmt(monto);
  const cont = $('trCuentas'); cont.innerHTML = '';
  cuentas.forEach(x=>{
    const b = document.createElement('button');
    b.textContent = x.etiqueta || x.id.toUpperCase(); b.className = x.id===cuentaSel ? 'on' : '';
    b.onclick = ()=>{ cuentaSel = x.id; renderTransfer(); };
    cont.appendChild(b);
  });
  const ref = t('reference') + ' ' + FERIAS[feria] + ' #' + (ventas.length+1);
  const qr = $('trQr');
  if(c.epc && ajustes.titular && ibanValido(c.iban)){ qr.hidden = false; qr.innerHTML = qrSvg(epcPayload(c, monto, ref)); }
  else{ qr.hidden = true; qr.innerHTML = ''; }
  $('trIban').textContent = ibanLindo(c.iban);
  $('trMeta').innerHTML = (ajustes.titular ? esc(t('holderLbl'))+': <b>'+esc(ajustes.titular)+'</b><br>' : '')
    + (c.bic ? 'BIC: <b>'+esc(c.bic)+'</b><br>' : '')
    + esc(t('trRef'))+': <b>'+esc(ref)+'</b>'
    + (!qr.hidden ? '<br><span style="font-size:12px">'+esc(t('trScan'))+'</span>'
       : (c.epc ? '<br><span style="font-size:13px;color:var(--red);font-weight:600">'+esc(!ajustes.titular ? t('noQrHolder') : t('noQrIban'))+'</span>' : '<br><span style="font-size:12px">'+esc(t('noQrAcc'))+'</span>'));
  return true;
}
function abrirTransfer(){ if(renderTransfer()) $('dlgTr').showModal(); }
$('trCopy').onclick = ()=>{ const c = ajustes.cuentas.find(x=>x.id===cuentaSel); if(c) copiar(c.iban.replace(/\s/g,''), 'IBAN ' + t('copied').toLowerCase()); };
$('trCopyAmt').onclick = ()=> copiar(total().toFixed(2));

function abrirAjustes(){
  $('sPaypal').value = ajustes.paypal || '';
  $('sTitular').value = ajustes.titular || '';
  $('sPaypalLink').value = ajustes.paypalLink || '';
  const cont = $('sCuentas'); cont.innerHTML = '';
  ajustes.cuentas.forEach((c,i)=>{
    const d = document.createElement('div');
    d.innerHTML = '<label>'+esc(t('account'))+' '+esc(c.etiqueta)+' — IBAN</label><input data-i="'+i+'" data-f="iban" value="'+esc(c.iban)+'" autocapitalize="characters" spellcheck="false">'
      + '<div class="aviso" style="font-size:12px;font-weight:600;margin-top:4px" id="sMsg'+i+'"></div>'
      + '<label>BIC / SWIFT ('+(lang==='es'?'opcional':'optional')+')</label><input data-i="'+i+'" data-f="bic" value="'+esc(c.bic||'')+'" autocapitalize="characters" spellcheck="false">';
    cont.appendChild(d);
    const chk = ()=>{
      const v = cont.querySelector('[data-i="'+i+'"][data-f="iban"]').value;
      const m = $('sMsg'+i);
      if(!v.trim()){ m.textContent=''; return; }
      const ok = ibanValido(v); m.textContent = ok ? '✓ '+t('ibanOk') : '✗ '+t('ibanBad'); m.className = ok ? 'ok' : 'mal';
    };
    cont.querySelector('[data-i="'+i+'"][data-f="iban"]').oninput = chk; chk();
  });
  $('dlgSet').showModal();
}

/* ================= grupos y catálogo ================= */
let gTmp = [];
function syncG(){ [...document.querySelectorAll('#gList .grow input')].forEach((inp,i)=>{ if(gTmp[i]) gTmp[i].nombre = inp.value; }); }
function renderGrupos(){
  const cont = $('gList'); cont.innerHTML = '';
  gTmp.forEach((g,i)=>{
    const row = document.createElement('div'); row.className = 'grow';
    const inp = document.createElement('input'); inp.value = g.nombre; inp.placeholder = t('groupName');
    const cnt = document.createElement('span'); cnt.className = 'cnt';
    const n = g.orig ? cfg.productos.filter(p=>p.cat===g.orig).length : 0;
    cnt.textContent = n ? n+' '+t('art') : t('emptyN');
    const up = document.createElement('button'); up.textContent='↑'; up.disabled = i===0;
    up.onclick = ()=>{ syncG(); [gTmp[i-1],gTmp[i]]=[gTmp[i],gTmp[i-1]]; renderGrupos(); };
    const dn = document.createElement('button'); dn.textContent='↓'; dn.disabled = i===gTmp.length-1;
    dn.onclick = ()=>{ syncG(); [gTmp[i+1],gTmp[i]]=[gTmp[i],gTmp[i+1]]; renderGrupos(); };
    const x = document.createElement('button'); x.textContent='✕'; x.className='x';
    x.onclick = ()=>{
      syncG();
      if(n && !confirm(t('groupHasProds',{g:g.orig,n:n}))) return;
      gTmp.splice(i,1); renderGrupos();
    };
    row.append(inp, cnt, up, dn, x); cont.appendChild(row);
  });
  if(!gTmp.length) cont.innerHTML = '<div style="color:var(--ink-soft);font-size:14px">'+esc(t('noGroups'))+'</div>';
}
$('btnGrupos').onclick = ()=>{
  gTmp = cfg.grupos.map(g=>({orig:g, nombre:g}));
  $('gHint').innerHTML = t('gHint',{f:'catalogo-'+SLUG[feria]+'.json'});
  renderGrupos(); $('dlgGru').showModal();
};
$('gAdd').onclick = ()=>{
  syncG(); gTmp.push({orig:null, nombre:''}); renderGrupos();
  const inputs = document.querySelectorAll('#gList .grow input'); if(inputs.length) inputs[inputs.length-1].focus();
};

$('gImport').onclick = ()=> $('gFile').click();
$('gFile').onchange = async e=>{
  const file = e.target.files && e.target.files[0]; if(!file) return;
  try{
    const cat = JSON.parse(await file.text());
    if(!Array.isArray(cat.productos) || !Array.isArray(cat.grupos)) throw 0;
    cfg.catalogo = cat.catalogo || 'importado'; cfg.grupos = cat.grupos; cfg.productos = cat.productos;
    ticket = []; saveCfg(); $('dlgGru').close(); render(); toast(t('catLoaded'));
  }catch(err){ toast(t('badCat')); }
  e.target.value = '';
};
$('gCancel').onclick = ()=> $('dlgGru').close();
$('gReset').onclick = ()=>{
  if(!confirm(t('resetQ'))) return;
  cfg = clone(DEFAULTS); ticket = []; saveCfg(); $('dlgGru').close(); render(); toast(t('catRestored'));
};
$('gSave').onclick = ()=>{
  syncG();
  const nombres = gTmp.map(g=>g.nombre.trim());
  if(nombres.some(n=>!n)){ toast(t('groupNoName')); return; }
  if(new Set(nombres.map(n=>n.toLowerCase())).size !== nombres.length){ toast(t('groupDup')); return; }
  const quedan = gTmp.filter(g=>g.orig).map(g=>g.orig);
  cfg.grupos.forEach(g=>{ if(!quedan.includes(g)) cfg.productos = cfg.productos.filter(p=>p.cat!==g); });
  gTmp.forEach((g,i)=>{ if(g.orig && g.orig !== nombres[i]) cfg.productos.forEach(p=>{ if(p.cat===g.orig) p.cat = nombres[i]; }); });
  cfg.grupos = nombres;
  ticket = ticket.filter(i => i.ref.startsWith('free') || cfg.productos.some(p=>p.id===i.ref));
  saveCfg(); $('dlgGru').close(); render(); toast(t('groupsUpdated'));
};

/* ================= ventas del día y cierres ================= */
const nomPago = id => PAGOS.includes(id) ? t('pay_'+id) : id;
const nomCuenta = id => { const c = (ajustes.cuentas||[]).find(x=>x.id===id); return c ? (c.etiqueta||id) : (id||''); };
$('btnLog').onclick = ()=>{
  const body = $('logBody');
  if(!ventas.length) body.innerHTML = '<div style="color:var(--ink-soft)">'+esc(t('noSales'))+'</div>';
  else body.innerHTML = ventas.slice().reverse().map(v=>{
    const h = new Date(v.hora).toLocaleTimeString(locale(),{hour:'2-digit',minute:'2-digit'});
    const det = v.items.map(i=>i.q+'× '+esc(i.n)).join(', ');
    return '<div><span>'+h+' · '+esc(nomPago(v.pago))+(v.cuenta?' ('+esc(nomCuenta(v.cuenta))+')':'')+'<br><span style="color:var(--ink-soft);font-size:12px">'+det+'</span></span><b class="num">'+fmt(v.total)+'</b></div>';
  }).join('');
  const por = porMedio(ventas);
  $('logSum').innerHTML = t('total')+': '+fmt(ventas.reduce((a,v)=>a+v.total,0))
    + Object.keys(por).map(k=>'<br><span style="font-weight:500;color:var(--ink-soft)">'+esc(nomPago(k))+': '+fmt(por[k].total)+'</span>').join('');
  $('dlgLog').showModal();
};
function porMedio(lista){
  const o = {}; lista.forEach(v=>{ o[v.pago] = o[v.pago] || {total:0,n:0}; o[v.pago].total = r2(o[v.pago].total+v.total); o[v.pago].n++; }); return o;
}
function renderCierres(){
  const body = $('cieBody');
  if(!cierres.length){ body.innerHTML = '<div style="color:var(--ink-soft)">'+esc(t('noClosings'))+'</div>'; return; }
  body.innerHTML = '';
  cierres.slice().reverse().forEach(c=>{
    const tot = c.ventas.reduce((a,v)=>a+v.total,0), f = new Date(c.hora);
    const box = document.createElement('div');
    box.style.cssText = 'display:block;padding:10px 0;border-bottom:1px solid #EFEDE8';
    box.innerHTML = '<b>'+esc(c.etiqueta)+'</b><br><span style="color:var(--ink-soft);font-size:12px">'
      + f.toLocaleDateString(locale())+' '+f.toLocaleTimeString(locale(),{hour:'2-digit',minute:'2-digit'})
      + ' · '+c.ventas.length+' '+(c.ventas.length===1?t('sale'):t('sales'))+' · '+fmt(tot)+'</span>';
    const fila = document.createElement('div'); fila.style.cssText = 'display:flex;gap:6px;margin-top:8px';
    const base = 'padding:9px;border:1px solid var(--line);background:#F7F6F3;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink);flex:1';
    const exp = document.createElement('button'); exp.textContent = t('exportBtn'); exp.style.cssText = base;
    exp.onclick = ()=>{ fuente = c; $('dlgCie').close(); abrirExport(); toast(t('exporting')+c.etiqueta); };
    const res = document.createElement('button'); res.textContent = t('toCash'); res.style.cssText = base;
    res.onclick = ()=>{
      if(!confirm(t('restoreQ',{n:c.etiqueta}))) return;
      ventas = ventas.concat(c.ventas); cierres = cierres.filter(x=>x!==c);
      saveVentas(); saveCierres(); $('dlgCie').close(); render(); toast(t('restored'));
    };
    const del = document.createElement('button'); del.textContent='✕';
    del.style.cssText = 'width:44px;padding:9px;border:1px solid #E7C4C4;background:#FFF2F2;color:var(--red);border-radius:8px;font-size:14px;font-weight:700';
    del.onclick = ()=>{
      if(!confirm(t('delClosingQ',{n:c.etiqueta}))) return;
      cierres = cierres.filter(x=>x!==c); saveCierres(); renderCierres(); toast(t('closingDeleted'));
    };
    fila.append(exp, res, del); box.appendChild(fila); body.appendChild(box);
  });
}
$('logCierres').onclick = ()=>{ renderCierres(); $('dlgLog').close(); $('dlgCie').showModal(); };
$('cieClose').onclick = ()=> $('dlgCie').close();
$('logClose').onclick = ()=> $('dlgLog').close();
$('logCopy').onclick = ()=>{
  if(!ventas.length){ toast(t('noSales')); return; }
  const por = porMedio(ventas);
  const txt = 'Huanaco — '+FERIAS[feria]+' — '+new Date().toLocaleDateString(locale())+'\n\n'
    + ventas.map(v=>new Date(v.hora).toLocaleTimeString(locale(),{hour:'2-digit',minute:'2-digit'})+' · '+nomPago(v.pago)+' · '+fmt(v.total)+' · '+v.items.map(i=>i.q+'x '+i.n).join(', ')).join('\n')
    + '\n\n'+t('total').toUpperCase()+': '+fmt(ventas.reduce((a,v)=>a+v.total,0))+'\n'
    + Object.keys(por).map(k=>nomPago(k)+': '+fmt(por[k].total)).join('\n');
  copiar(txt);
};
$('logReset').onclick = ()=>{
  if(!ventas.length){ toast(t('noSalesToClose')); return; }
  const etiqueta = prompt(t('closingName'), t('closing')+' '+FERIAS[feria]+' '+new Date().toLocaleDateString(locale()));
  if(etiqueta === null) return;
  cierres.push({id:Date.now(), hora:new Date().toISOString(), etiqueta:(etiqueta||'').trim() || (t('closing')+' '+new Date().toLocaleDateString(locale())), ventas:ventas.slice()});
  ventas = []; saveCierres(); saveVentas(); $('dlgLog').close(); render(); toast(t('cashClosed'));
};

/* ================= exportar ================= */
function abrirExport(){ $('dlgExp').showModal(); }
$('logExp').onclick = ()=>{ if(!ventas.length){ toast(t('noSalesToExport')); return; } fuente = null; abrirExport(); };
$('eCancel').onclick = ()=>{ $('dlgExp').close(); fuente = null; };
const fechaArch = () => (fuente ? fuente.hora : new Date().toISOString()).slice(0,10);
function filasVentas(){
  const H = I18N[lang].hdr;
  const rows = datosVenta().slice().sort((a,b)=>new Date(a.hora)-new Date(b.hora)).map(v=>{
    const d = new Date(v.hora);
    return [d.toLocaleDateString(locale()), d.toLocaleTimeString(locale(),{hour:'2-digit',minute:'2-digit',hour12:false}),
            FERIAS[v.feria||feria]||'', nomPago(v.pago), v.cuenta ? nomCuenta(v.cuenta) : '',
            v.items.map(i=>i.q+'x '+i.n).join(' + '), dec(v.total)];
  });
  return {cab:H, filas:rows};
}
function filasMedios(){
  const por = porMedio(datosVenta());
  return {cab:I18N[lang].hdrMedia, filas:Object.keys(por).map(k=>[fechaArch(), FERIAS[feria], nomPago(k), dec(por[k].total), por[k].n])};
}
const aCsv = ({cab,filas}) => [cab].concat(filas).map(f=>f.map(c=>{ c = String(c); return /[;"\n]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c; }).join(';')).join('\r\n');
$('eVentas').onclick = async ()=>{
  const csv = aCsv(filasVentas()), nom = t('csvSales')+'-'+SLUG[feria]+'-'+fechaArch()+'.csv';
  $('dlgExp').close();
  toast(await descargar(nom, csv, 'text/csv;charset=utf-8') ? t('fileGenerated') : t('cantDownload')); fuente = null;
};
$('eMedios').onclick = async ()=>{
  const csv = aCsv(filasMedios()), nom = t('csvMedia')+'-'+SLUG[feria]+'-'+fechaArch()+'.csv';
  $('dlgExp').close();
  toast(await descargar(nom, csv, 'text/csv;charset=utf-8') ? t('fileGenerated') : t('cantDownload')); fuente = null;
};
$('eCopy').onclick = ()=>{
  const {cab,filas} = filasVentas();
  $('dlgExp').close(); copiar([cab].concat(filas).map(f=>f.join('\t')).join('\n')); fuente = null;
};
async function descargar(nombre, texto, mime){
  try{
    const blob = new Blob(['﻿'+texto], {type:mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = nombre; a.rel = 'noopener';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 2000);
    return true;
  }catch(e){ return false; }
}

/* ================= feria e idioma ================= */
$('langBtn').onclick = ()=>{ lang = lang==='es' ? 'en' : 'es'; STORE.set('caja:lang', lang); applyLang(); renderPagos(); render(); renderEstado(); };
$('feriaSel').onchange = async e=>{
  if(ticket.length && !confirm(t('switchQ'))){ e.target.value = feria; return; }
  feria = e.target.value; STORE.set('caja:feria', feria);
  ticket = []; guardaOK = null; await load(); applyLang(); renderPagos(); render(); renderEstado();
};

/* ================= sin conexión ================= */
if('serviceWorker' in navigator && location.protocol === 'https:' && location.hostname.indexOf('claude.ai') === -1){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

/* ================= init ================= */
(async ()=>{
  await load(); applyLang(); renderPagos(); render();
  try{
    const marca = 'p'+Date.now(); STORE.set('caja:prueba', marca);
    if(STORE.get('caja:prueba') !== marca || !STORE.persistente) guardaOK = false;
  }catch(e){ guardaOK = false; }
  renderEstado();
  if(!STORE.persistente){
    const w = document.createElement('div');
    w.style.cssText = 'padding:0 0 8px;font-size:12px;color:var(--red);font-weight:600';
    w.textContent = t('noPersist');
    document.querySelector('.tools').insertAdjacentElement('beforebegin', w);
  }
  window.addEventListener('beforeunload', e=>{ if(ticket.length){ e.preventDefault(); e.returnValue=''; } });
})();
</script>
